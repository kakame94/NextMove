name: klaris_ios
description: "Klaris — adjointe IA des courtiers immo. App iOS Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.4

  # Push notifications
  firebase_core: ^3.10.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Offline / connectivity
  connectivity_plus: ^6.1.0

  # Map + voice
  apple_maps_flutter: ^1.4.0
  record: ^6.0.0
  permission_handler: ^11.3.1

  # Apple Sign In
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # Observability
  sentry_flutter: ^8.10.1

  # Fonts (Geist + Geist Mono — alignement avec web)
  google_fonts: ^6.2.1

  # Storage local chiffre
  drift: ^2.21.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Utils
  intl: ^0.20.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.21.2
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  patrol: ^3.13.2

flutter:
  uses-material-design: false
  generate: true
