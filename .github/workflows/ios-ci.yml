name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'klaris_ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'klaris_ios/**'
      - '.github/workflows/ios-ci.yml'

jobs:
  flutter:
    runs-on: macos-14
    timeout-minutes: 25
    defaults:
      run:
        working-directory: klaris_ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Provision env.dart (gitignored — CI uses the example config)
        run: cp lib/core/env.example.dart lib/core/env.dart

      - name: Generate code (drift / *.g.dart)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Tests
        run: flutter test --coverage

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage
          path: klaris_ios/coverage/lcov.info
          retention-days: 7
