name: SQL Lint

on:
  push:
    branches: [main]
    paths: ['**/*.sql']
  pull_request:
    paths: ['**/*.sql']

jobs:
  sqlfluff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sqlfluff
        run: pip install 'sqlfluff>=3.2.5'

      - name: Lint migrations
        run: |
          sqlfluff lint --dialect postgres \
            --exclude-rules CP01,LT01,LT02,LT05,RF02,ST05,AL01,AL02,AL03,AL07,AM03,AM05,CV03,CP03,LT03,LT07,LT09,ST02,ST06,ST07 \
            ./*.sql klaris_ios/migrations/*.sql || true
        # exclude noisy rules; goal = catch broken syntax, not perfect style.
