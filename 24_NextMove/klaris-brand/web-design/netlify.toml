[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hide dev files from public
[[redirects]]
  from = "/spec.md"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/wireframes.md"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/mockups/*"
  to = "/index.html"
  status = 404

# Friendly URLs
[[redirects]]
  from = "/fr"
  to = "/landing-fr.html"
  status = 200
[[redirects]]
  from = "/en"
  to = "/landing-en.html"
  status = 200
