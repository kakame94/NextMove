<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      .ttl{font-family:'Geist',sans-serif;font-weight:700;letter-spacing:-0.02em;fill:oklch(0.20 0.02 30)}
      .sub{font-family:'Geist',sans-serif;font-weight:400;fill:oklch(0.50 0.02 30)}
      .pill{font-family:'Geist',sans-serif;font-weight:500;fill:oklch(0.55 0.18 30)}
      .num{font-family:'Geist',sans-serif;font-weight:700;font-size:64px;fill:oklch(0.55 0.18 30)}
      .step-ttl{font-family:'Geist',sans-serif;font-weight:600;font-size:32px;fill:oklch(0.20 0.02 30)}
      .step-desc{font-family:'Geist',sans-serif;font-size:22px;fill:oklch(0.50 0.02 30)}
    </style>
  </defs>
  <rect width="1080" height="1080" fill="oklch(0.98 0.005 60)"/>
  <rect x="80" y="80" width="280" height="44" rx="22" fill="oklch(0.55 0.18 30 / 0.10)"/>
  <text class="pill" x="220" y="109" font-size="18" text-anchor="middle">● COMMENT ÇA MARCHE</text>

  <text class="ttl" x="80" y="240" font-size="64">SMS arrive.</text>
  <text class="ttl" x="80" y="320" font-size="64">Cléa qualifie.</text>
  <text class="ttl" x="80" y="400" font-size="64" fill="oklch(0.55 0.18 30)">Tu fermes.</text>

  <!-- 3 steps stacked -->
  <g transform="translate(80 500)">
    <circle cx="50" cy="50" r="50" fill="oklch(0.55 0.18 30 / 0.10)" stroke="oklch(0.55 0.18 30)" stroke-width="3"/>
    <text x="50" y="68" class="num" text-anchor="middle">1</text>
    <text x="130" y="48" class="step-ttl">Le prospect texte ton numéro</text>
    <text x="130" y="84" class="step-desc">Ton numéro habituel. Pas d'app à installer.</text>
  </g>

  <line x1="130" y1="600" x2="130" y2="640" stroke="oklch(0.55 0.18 30)" stroke-width="2" stroke-dasharray="4 4"/>

  <g transform="translate(80 660)">
    <circle cx="50" cy="50" r="50" fill="oklch(0.55 0.18 30 / 0.10)" stroke="oklch(0.55 0.18 30)" stroke-width="3"/>
    <text x="50" y="68" class="num" text-anchor="middle">2</text>
    <text x="130" y="48" class="step-ttl">Cléa pose 5 questions</text>
    <text x="130" y="84" class="step-desc">Ton naturel Québécois. Signature « son assistante ».</text>
  </g>

  <line x1="130" y1="760" x2="130" y2="800" stroke="oklch(0.55 0.18 30)" stroke-width="2" stroke-dasharray="4 4"/>

  <g transform="translate(80 820)">
    <circle cx="50" cy="50" r="50" fill="oklch(0.55 0.18 30)" stroke="oklch(0.55 0.18 30)" stroke-width="3"/>
    <text x="50" y="68" class="num" text-anchor="middle" fill="oklch(0.99 0 0)">3</text>
    <text x="130" y="48" class="step-ttl">Lead chaud, ton dashboard</text>
    <text x="130" y="84" class="step-desc">Score de température + résumé. Tu rappelles.</text>
  </g>

  <text x="200" y="1010" font-family="Geist" font-size="22" font-weight="700" fill="oklch(0.20 0.02 30)">Cléa · clea.app</text>
  <g transform="translate(80 970) scale(0.4)">
    <path d="M 152 54 A 64 64 0 1 0 152 146" fill="none" stroke="oklch(0.55 0.18 30)" stroke-width="34" stroke-linecap="round"/>
    <path d="M 144 142 Q 168 162 178 178 Q 156 168 138 156 Z" fill="oklch(0.55 0.18 30)"/>
    <circle cx="78" cy="100" r="6" fill="oklch(0.55 0.18 30)"/><circle cx="100" cy="100" r="6" fill="oklch(0.55 0.18 30)"/><circle cx="122" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
  </g>
</svg>
