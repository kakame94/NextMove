<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      .ttl{font-family:'Geist',sans-serif;font-weight:700;letter-spacing:-0.02em;fill:oklch(0.20 0.02 30)}
      .sub{font-family:'Geist',sans-serif;font-weight:400;fill:oklch(0.50 0.02 30)}
      .pill{font-family:'Geist',sans-serif;font-weight:500;fill:oklch(0.55 0.18 30)}
      .msg{font-family:'Geist',sans-serif;font-size:24px}
      .flag{font-family:'Geist',sans-serif;font-weight:700;font-size:20px}
    </style>
  </defs>
  <rect width="1080" height="1080" fill="oklch(0.98 0.005 60)"/>
  <rect x="80" y="80" width="240" height="44" rx="22" fill="oklch(0.55 0.18 30 / 0.10)"/>
  <text class="pill" x="200" y="109" font-size="18" text-anchor="middle">● FONCTIONNALITÉ</text>

  <text class="ttl" x="80" y="240" font-size="64">FR + EN.</text>
  <text class="ttl" x="80" y="320" font-size="64">Détection auto.</text>
  <text class="sub" x="80" y="380" font-size="26">Zéro paramètre. Anglos, francos, mêmes flux.</text>

  <!-- FR side -->
  <g transform="translate(80 460)">
    <rect x="0" y="0" width="440" height="220" rx="16" fill="oklch(0.55 0.18 30 / 0.06)" stroke="oklch(0.55 0.18 30 / 0.30)"/>
    <rect x="20" y="20" width="60" height="32" rx="8" fill="oklch(0.55 0.18 30)"/>
    <text x="50" y="42" class="flag" fill="oklch(0.99 0 0)" text-anchor="middle">FR</text>
    <rect x="20" y="80" width="380" height="56" rx="14" fill="oklch(0.94 0.015 60)"/>
    <text x="40" y="116" class="msg" fill="oklch(0.20 0.02 30)">Bonsoir, je cherche un duplex…</text>
    <rect x="60" y="148" width="360" height="56" rx="14" fill="oklch(0.55 0.18 30)"/>
    <text x="80" y="184" class="msg" fill="oklch(0.99 0 0)">Bonsoir! Acheter ou vendre?</text>
  </g>

  <!-- EN side -->
  <g transform="translate(560 460)">
    <rect x="0" y="0" width="440" height="220" rx="16" fill="oklch(0.55 0.18 30 / 0.06)" stroke="oklch(0.55 0.18 30 / 0.30)"/>
    <rect x="20" y="20" width="60" height="32" rx="8" fill="oklch(0.55 0.18 30)"/>
    <text x="50" y="42" class="flag" fill="oklch(0.99 0 0)" text-anchor="middle">EN</text>
    <rect x="20" y="80" width="380" height="56" rx="14" fill="oklch(0.94 0.015 60)"/>
    <text x="40" y="116" class="msg" fill="oklch(0.20 0.02 30)">Hi, looking for a duplex…</text>
    <rect x="60" y="148" width="360" height="56" rx="14" fill="oklch(0.55 0.18 30)"/>
    <text x="80" y="184" class="msg" fill="oklch(0.99 0 0)">Hi! Buying or selling?</text>
  </g>

  <text class="ttl" x="80" y="800" font-size="34">Le marché Québec sans compromis.</text>
  <text class="sub" x="80" y="850" font-size="22">Charlyse, Joanel, JP — tous l'exigent. Cléa le fait.</text>

  <g transform="translate(80 970) scale(0.4)">
    <path d="M 152 54 A 64 64 0 1 0 152 146" fill="none" stroke="oklch(0.55 0.18 30)" stroke-width="34" stroke-linecap="round"/>
    <path d="M 144 142 Q 168 162 178 178 Q 156 168 138 156 Z" fill="oklch(0.55 0.18 30)"/>
    <circle cx="78" cy="100" r="6" fill="oklch(0.55 0.18 30)"/><circle cx="100" cy="100" r="6" fill="oklch(0.55 0.18 30)"/><circle cx="122" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
  </g>
  <text x="200" y="1010" font-family="Geist" font-size="22" font-weight="700" fill="oklch(0.20 0.02 30)">Cléa · clea.app</text>
</svg>
