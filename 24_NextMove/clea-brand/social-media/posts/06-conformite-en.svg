<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      .ttl{font-family:'Geist',sans-serif;font-weight:700;letter-spacing:-0.02em;fill:oklch(0.20 0.02 30)}
      .sub{font-family:'Geist',sans-serif;font-weight:400;fill:oklch(0.50 0.02 30)}
      .pill{font-family:'Geist',sans-serif;font-weight:500;fill:oklch(0.60 0.15 145)}
      .badge{font-family:'Geist',sans-serif;font-weight:700;font-size:20px;fill:oklch(0.99 0 0)}
      .lbl{font-family:'Geist',sans-serif;font-weight:600;font-size:22px;fill:oklch(0.20 0.02 30)}
      .desc{font-family:'Geist',sans-serif;font-weight:400;font-size:18px;fill:oklch(0.50 0.02 30)}
    </style>
  </defs>
  <rect width="1080" height="1080" fill="oklch(0.98 0.005 60)"/>
  <rect x="80" y="80" width="220" height="44" rx="22" fill="oklch(0.60 0.15 145 / 0.12)"/>
  <text class="pill" x="190" y="109" font-size="18" text-anchor="middle">● COMPLIANCE</text>

  <text class="ttl" x="80" y="240" font-size="60">Compliant by default.</text>
  <text class="ttl" x="80" y="310" font-size="60">Not optional.</text>

  <g transform="translate(80 410)">
    <rect width="940" height="120" rx="16" fill="oklch(1 0 0)" stroke="oklch(0.90 0.02 60)"/>
