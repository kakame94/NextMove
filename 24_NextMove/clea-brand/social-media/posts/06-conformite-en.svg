    <text x="60" y="68" class="badge" text-anchor="middle">✓</text>
    <text x="120" y="48" class="lbl">OACIQ</text>
    <text x="120" y="84" class="desc">Traceable · Accountable · You sign every action</text>
  </g>
  <g transform="translate(80 560)">
    <rect width="940" height="120" rx="16" fill="oklch(1 0 0)" stroke="oklch(0.90 0.02 60)"/>
    <circle cx="60" cy="60" r="32" fill="oklch(0.60 0.15 145)"/>
    <text x="60" y="68" class="badge" text-anchor="middle">✓</text>
    <text x="120" y="48" class="lbl">Quebec Law 25</text>
    <text x="120" y="84" class="desc">Consent · Opt-out &lt; 1h · Hosted in Canada</text>
  </g>
  <g transform="translate(80 710)">
    <rect width="940" height="120" rx="16" fill="oklch(1 0 0)" stroke="oklch(0.90 0.02 60)"/>
    <circle cx="60" cy="60" r="32" fill="oklch(0.60 0.15 145)"/>
    <text x="60" y="68" class="badge" text-anchor="middle">✓</text>
    <text x="120" y="48" class="lbl">CASL + Twilio Policy</text>
