<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      .ttl{font-family:'Geist',sans-serif;font-weight:700;letter-spacing:-0.02em;fill:oklch(0.20 0.02 30)}
      .sub{font-family:'Geist',sans-serif;font-weight:400;fill:oklch(0.50 0.02 30)}
      .pill{font-family:'Geist',sans-serif;font-weight:500;fill:oklch(0.55 0.18 30)}
      .lbl{font-family:'Geist',sans-serif;font-weight:500;font-size:18px;fill:oklch(0.50 0.02 30)}
    </style>
  </defs>
  <rect width="1080" height="1080" fill="oklch(0.98 0.005 60)"/>
  <rect x="80" y="80" width="240" height="44" rx="22" fill="oklch(0.55 0.18 30 / 0.10)"/>
  <text class="pill" x="200" y="109" font-size="18" text-anchor="middle">● FONCTIONNALITÉ</text>

  <text class="ttl" x="80" y="240" font-size="64">Cléa range tes leads</text>
  <text class="ttl" x="80" y="320" font-size="64">par <tspan fill="oklch(0.55 0.22 25)">température</tspan>.</text>

  <!-- 5 dots -->
  <g transform="translate(160 480)">
    <circle cx="0" cy="0" r="60" fill="oklch(0.65 0.10 230)"/>
    <text x="0" y="100" class="lbl" text-anchor="middle">FROID</text>
  </g>
  <g transform="translate(330 480)">
    <circle cx="0" cy="0" r="60" fill="oklch(0.70 0.12 200)"/>
    <text x="0" y="100" class="lbl" text-anchor="middle">TIÈDE</text>
  </g>
  <g transform="translate(500 480)">
    <circle cx="0" cy="0" r="60" fill="oklch(0.75 0.15 75)"/>
    <text x="0" y="100" class="lbl" text-anchor="middle">CHAUD</text>
  </g>
  <g transform="translate(670 480)">
    <circle cx="0" cy="0" r="60" fill="oklch(0.65 0.18 50)"/>
    <text x="0" y="100" class="lbl" text-anchor="middle">TRÈS CHAUD</text>
  </g>
  <g transform="translate(840 480)">
    <circle cx="0" cy="0" r="80" fill="oklch(0.55 0.22 25)"/>
    <text x="0" y="120" class="lbl" text-anchor="middle" font-weight="700" fill="oklch(0.55 0.22 25)">BRÛLANT 🔥</text>
  </g>

  <text class="sub" x="80" y="780" font-size="28">Calculé automatiquement à partir des réponses,</text>
  <text class="sub" x="80" y="816" font-size="28">du timing et de la pré-qualif hypothécaire.</text>
  <text class="ttl" x="80" y="900" font-size="32">Tu rappelles le brûlant en premier.</text>

  <g transform="translate(80 970) scale(0.4)">
    <path d="M 152 54 A 64 64 0 1 0 152 146" fill="none" stroke="oklch(0.55 0.18 30)" stroke-width="34" stroke-linecap="round"/>
    <path d="M 144 142 Q 168 162 178 178 Q 156 168 138 156 Z" fill="oklch(0.55 0.18 30)"/>
    <circle cx="78" cy="100" r="6" fill="oklch(0.55 0.18 30)"/><circle cx="100" cy="100" r="6" fill="oklch(0.55 0.18 30)"/><circle cx="122" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
  </g>
  <text x="200" y="1010" font-family="Geist" font-size="22" font-weight="700" fill="oklch(0.20 0.02 30)">Cléa · clea.app</text>
