<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="t7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="oklch(0.94 0.03 45)"/><stop offset="100%" stop-color="oklch(0.92 0.04 30)"/></linearGradient>
    <style>
      .quote{font-family:'Geist',sans-serif;font-weight:500;letter-spacing:-0.01em;fill:oklch(0.20 0.02 30)}
      .em{fill:oklch(0.55 0.18 30);font-weight:600}
      .name{font-family:'Geist',sans-serif;font-weight:600;font-size:22px;fill:oklch(0.20 0.02 30)}
      .role{font-family:'Geist',sans-serif;font-weight:400;font-size:18px;fill:oklch(0.50 0.02 30)}
      .pill{font-family:'Geist',sans-serif;font-weight:500;fill:oklch(0.55 0.18 30)}
    </style>
  </defs>
  <rect width="1080" height="1080" fill="url(#t7)"/>
  <rect x="80" y="80" width="240" height="44" rx="22" fill="oklch(0.99 0 0)"/>
  <text class="pill" x="200" y="109" font-size="18" text-anchor="middle">● PILOTE TERRAIN</text>

  <!-- giant quote mark -->
  <text x="80" y="320" font-family="Geist" font-size="240" font-weight="700" fill="oklch(0.55 0.18 30)" letter-spacing="-0.04em">"</text>

  <text x="80" y="430" class="quote" font-size="40">Une IA qui génère une <tspan class="em">offre</tspan></text>
  <text x="80" y="490" class="quote" font-size="40"><tspan class="em">d'achat en un rien de temps.</tspan></text>
  <text x="80" y="560" class="quote" font-size="32">Pendant que je suis en visite,</text>
  <text x="80" y="610" class="quote" font-size="32">Cléa parle à mes prospects et</text>
  <text x="80" y="660" class="quote" font-size="32">me sort une fiche prête.</text>

  <text x="80" y="760" class="quote" font-size="28" fill="oklch(0.50 0.02 30)">Avant: 30-60 min par offre.</text>
  <text x="80" y="800" class="quote" font-size="28" fill="oklch(0.55 0.18 30)" font-weight="600">Là: secondes.</text>

  <!-- avatar + cite -->
  <circle cx="120" cy="900" r="40" fill="oklch(0.55 0.18 30 / 0.15)"/>
  <text x="120" y="912" font-family="Geist" font-weight="600" font-size="22" fill="oklch(0.55 0.18 30)" text-anchor="middle">JD</text>
  <text x="180" y="895" class="name">Joanel D.</text>
  <text x="180" y="920" class="role">Courtier · Grand Montréal · 90% close rate</text>

  <g transform="translate(80 970) scale(0.4)">
    <path d="M 152 54 A 64 64 0 1 0 152 146" fill="none" stroke="oklch(0.55 0.18 30)" stroke-width="34" stroke-linecap="round"/>
    <path d="M 144 142 Q 168 162 178 178 Q 156 168 138 156 Z" fill="oklch(0.55 0.18 30)"/>
    <circle cx="78" cy="100" r="6" fill="oklch(0.55 0.18 30)"/><circle cx="100" cy="100" r="6" fill="oklch(0.55 0.18 30)"/><circle cx="122" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
  </g>
  <text x="200" y="1010" font-family="Geist" font-size="22" font-weight="700" fill="oklch(0.20 0.02 30)">Cléa · clea.app</text>
