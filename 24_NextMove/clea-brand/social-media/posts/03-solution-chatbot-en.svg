    </style>
  </defs>
  <rect width="1080" height="1080" fill="oklch(0.98 0.005 60)"/>
  <rect x="80" y="80" width="260" height="44" rx="22" fill="oklch(0.55 0.18 30 / 0.10)"/>
  <text class="pill" x="210" y="109" font-size="18" text-anchor="middle">● THE SOLUTION</text>
  <text class="ttl" x="80" y="220" font-size="56">Cléa qualifies.</text>
  <text class="ttl" x="80" y="290" font-size="56">You sell.</text>

  <g transform="translate(80 360)">
    <rect x="0" y="0" width="540" height="64" rx="20" fill="oklch(0.94 0.015 60)"/>
    <text x="20" y="28" class="msg" fill="oklch(0.20 0.02 30)">Hi, looking for a duplex in</text>
    <text x="20" y="54" class="msg" fill="oklch(0.20 0.02 30)">Verdun, budget 450K</text>
  </g>
  <g transform="translate(380 450)">
    <rect x="0" y="0" width="540" height="100" rx="20" fill="oklch(0.55 0.18 30)"/>
    <text x="20" y="28" class="msg" fill="oklch(0.99 0 0)">Hi! Thanks for reaching</text>
    <text x="20" y="56" class="msg" fill="oklch(0.99 0 0)">Joanel. I'm his assistant.</text>
    <text x="20" y="84" class="msg" fill="oklch(0.99 0 0)">Buying or selling?</text>
  </g>
  <g transform="translate(80 580)">
    <rect x="0" y="0" width="160" height="46" rx="20" fill="oklch(0.94 0.015 60)"/>
    <text x="20" y="30" class="msg" fill="oklch(0.20 0.02 30)">Buying</text>
  </g>
  <g transform="translate(380 650)">
    <rect x="0" y="0" width="500" height="64" rx="20" fill="oklch(0.55 0.18 30)"/>
    <text x="20" y="28" class="msg" fill="oklch(0.99 0 0)">Great! Which area are</text>
    <text x="20" y="54" class="msg" fill="oklch(0.99 0 0)">you looking at?</text>
  </g>

  <text class="sub" x="80" y="850" font-size="26">5 questions. One summary. A hot lead, ready</text>
  <text class="sub" x="80" y="884" font-size="26">to action. While you do what you love.</text>

  <g transform="translate(80 970) scale(0.4)">
