<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <title>Cléa Instagram / X header</title>
  <defs>
    <linearGradient id="igbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="oklch(0.55 0.18 30)"/>
      <stop offset="100%" stop-color="oklch(0.45 0.20 28)"/>
    </linearGradient>
    <style>
      .ttl{font-family:'Geist',sans-serif;font-weight:700;letter-spacing:-0.02em;fill:oklch(0.99 0 0)}
      .sub{font-family:'Geist',sans-serif;font-weight:400;fill:oklch(0.99 0 0 / 0.85)}
    </style>
  </defs>
  <rect width="1500" height="500" fill="url(#igbg)"/>

  <!-- big subtle bubble shape decoration -->
  <path d="M 1100 -50 Q 1500 50 1450 350 Q 1300 600 1000 480 Q 800 380 900 150 Q 1000 -50 1100 -50 Z"
        fill="oklch(0.99 0 0 / 0.06)"/>

  <!-- mark mono white -->
  <g transform="translate(80 170) scale(1.1)" color="oklch(0.99 0 0)">
    <path d="M 152 54 A 64 64 0 1 0 152 146"
          fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round"/>
    <path d="M 144 142 Q 168 162 178 178 Q 156 168 138 156 Z"
          fill="currentColor"/>
    <circle cx="78" cy="100" r="6" fill="currentColor"/>
    <circle cx="100" cy="100" r="6" fill="currentColor"/>
    <circle cx="122" cy="100" r="6" fill="currentColor"/>
  </g>

  <text class="ttl" x="370" y="240" font-size="72">Cléa</text>
  <text class="sub" x="370" y="300" font-size="26">L'adjointe IA des courtiers immobiliers</text>
  <text class="sub" x="370" y="340" font-size="20">SMS de qualification · CRM scoring · FR/EN · Conforme OACIQ</text>
</svg>
