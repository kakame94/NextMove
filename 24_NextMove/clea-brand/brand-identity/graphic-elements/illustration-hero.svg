<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cléa — Hero illustration
  Concept: phone showing SMS thread (incoming + Cléa reply) connected by soft arc
  to a dashboard card showing prospect score. Visualizes: SMS → Cléa → CRM.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="SMS to Cléa to dashboard">
  <title>Cléa workflow</title>
  <defs>
    <linearGradient id="bg-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(0.55 0.18 30 / 0.08)"/>
      <stop offset="100%" stop-color="oklch(0.55 0.18 30 / 0)"/>
    </linearGradient>
    <style>
      .body { font-family: 'Geist', system-ui, sans-serif; }
      .msg-text { font-size: 12px; fill: oklch(0.20 0.02 30); }
      .msg-text-out { font-size: 12px; fill: oklch(0.99 0 0); }
      .lbl { font-size: 10px; fill: oklch(0.50 0.02 30); }
      .stat-num { font-size: 22px; font-weight: 600; fill: oklch(0.20 0.02 30); }
      .heat-dot { stroke: oklch(0.99 0 0); stroke-width: 1; }
    </style>
  </defs>

  <!-- background glow -->
  <rect x="0" y="0" width="720" height="480" fill="url(#bg-glow)"/>

  <!-- LEFT: phone frame with SMS thread -->
  <g transform="translate(40 40)">
    <!-- phone outer -->
    <rect x="0" y="0" width="220" height="400" rx="32"
          fill="oklch(1 0 0)" stroke="oklch(0.90 0.02 60)" stroke-width="1.5"/>
    <!-- notch -->
    <rect x="80" y="14" width="60" height="6" rx="3" fill="oklch(0.94 0.015 60)"/>

    <!-- header -->
    <text x="110" y="44" class="body lbl" text-anchor="middle">Joanel courtier</text>
    <line x1="16" y1="56" x2="204" y2="56" stroke="oklch(0.90 0.02 60)" stroke-width="1"/>

    <!-- incoming msg 1 -->
    <g transform="translate(16 72)">
      <rect width="160" height="40" rx="14" fill="oklch(0.94 0.015 60)"/>
      <text x="14" y="18" class="body msg-text">Bonsoir, je cherche un</text>
      <text x="14" y="32" class="body msg-text">duplex à Verdun, 450K</text>
    </g>

    <!-- outgoing msg (Cléa) -->
    <g transform="translate(36 124)">
      <rect width="170" height="56" rx="14" fill="oklch(0.55 0.18 30)"/>
      <text x="14" y="18" class="body msg-text-out">Bonsoir! Je suis</text>
      <text x="14" y="32" class="body msg-text-out">l'assistante de Joanel.</text>
      <text x="14" y="46" class="body msg-text-out">Acheter ou vendre?</text>
    </g>

    <!-- incoming msg 2 -->
    <g transform="translate(16 192)">
      <rect width="80" height="28" rx="14" fill="oklch(0.94 0.015 60)"/>
      <text x="14" y="18" class="body msg-text">Acheter</text>
    </g>

    <!-- outgoing msg 2 -->
    <g transform="translate(36 232)">
      <rect width="160" height="40" rx="14" fill="oklch(0.55 0.18 30)"/>
      <text x="14" y="18" class="body msg-text-out">Super! Dans quel</text>
      <text x="14" y="32" class="body msg-text-out">secteur?</text>
    </g>

    <!-- typing indicator -->
    <g transform="translate(16 284)">
      <rect width="60" height="24" rx="12" fill="oklch(0.94 0.015 60)"/>
      <circle cx="20" cy="12" r="2.5" fill="oklch(0.50 0.02 30)"/>
      <circle cx="30" cy="12" r="2.5" fill="oklch(0.50 0.02 30)"/>
      <circle cx="40" cy="12" r="2.5" fill="oklch(0.50 0.02 30)"/>
    </g>
  </g>

  <!-- ARROW connector -->
  <g>
    <path d="M 270 240 Q 360 180 450 200"
          fill="none" stroke="oklch(0.55 0.18 30)" stroke-width="2.5"
          stroke-dasharray="6 6" stroke-linecap="round"/>
    <path d="M 444 196 L 454 200 L 446 208"
          fill="none" stroke="oklch(0.55 0.18 30)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cléa avatar bubble at midpoint -->
    <g transform="translate(335 168)">
      <circle cx="20" cy="20" r="22" fill="oklch(1 0 0)" stroke="oklch(0.90 0.02 60)" stroke-width="1.5"/>
      <!-- mini submark -->
      <g transform="translate(8 8) scale(0.12)">
        <path d="M 152 54 A 64 64 0 1 0 152 146"
              fill="none" stroke="oklch(0.55 0.18 30)" stroke-width="34" stroke-linecap="round"/>
        <path d="M 144 142 Q 168 162 178 178 Q 156 168 138 156 Z"
              fill="oklch(0.55 0.18 30)"/>
        <circle cx="78" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
        <circle cx="100" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
        <circle cx="122" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
      </g>
      <text x="20" y="56" class="body lbl" text-anchor="middle">Cléa</text>
    </g>
  </g>

  <!-- RIGHT: dashboard prospect card -->
  <g transform="translate(440 100)">
    <rect width="240" height="280" rx="14"
          fill="oklch(1 0 0)" stroke="oklch(0.90 0.02 60)" stroke-width="1.5"/>

    <!-- header -->
    <text x="20" y="32" class="body lbl">PROSPECT QUALIFIÉ</text>
    <line x1="20" y1="44" x2="220" y2="44" stroke="oklch(0.90 0.02 60)"/>

    <!-- name -->
    <text x="20" y="68" class="body" font-size="16" font-weight="600" fill="oklch(0.20 0.02 30)">M. Tremblay</text>
    <text x="20" y="86" class="body lbl">Acheteur · Verdun · 450K</text>

    <!-- heat dial -->
    <g transform="translate(20 104)">
      <text x="0" y="0" class="body lbl">TEMPÉRATURE</text>
      <circle cx="6"  cy="14" r="6" fill="oklch(0.65 0.10 230)" class="heat-dot"/>
      <circle cx="22" cy="14" r="6" fill="oklch(0.70 0.12 200)" class="heat-dot"/>
      <circle cx="38" cy="14" r="6" fill="oklch(0.75 0.15 75)"  class="heat-dot"/>
      <circle cx="54" cy="14" r="6" fill="oklch(0.65 0.18 50)"  class="heat-dot"/>
      <circle cx="70" cy="14" r="9" fill="oklch(0.55 0.22 25)"  class="heat-dot"/>
    </g>

    <!-- key facts -->
    <g transform="translate(20 148)">
      <text x="0" y="0" class="body lbl">PRÉ-QUALIFIÉ</text>
      <text x="0" y="18" class="body" font-size="13" fill="oklch(0.20 0.02 30)">Desjardins · 450K</text>
    </g>
    <g transform="translate(20 188)">
      <text x="0" y="0" class="body lbl">DÉLAI</text>
      <text x="0" y="18" class="body" font-size="13" fill="oklch(0.20 0.02 30)">1-3 mois</text>
    </g>

    <!-- CTA -->
    <g transform="translate(20 230)">
      <rect width="200" height="32" rx="8" fill="oklch(0.55 0.18 30)"/>
      <text x="100" y="20" class="body" font-size="12" font-weight="500"
            fill="oklch(0.99 0 0)" text-anchor="middle">Rappeler maintenant</text>
    </g>
  </g>
</svg>
