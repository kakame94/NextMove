<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cléa — Submark (C monogram)
  200×200 viewBox. Use ≥ 32px display.
  Concept: chat bubble C with conversation dots + soft tail (assistant cocoon)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cléa">
  <title>Cléa</title>
  <!-- soft halo (optional; transparent on most placements) -->
  <circle cx="100" cy="100" r="98" fill="oklch(0.55 0.18 30 / 0.0)"/>

  <!-- chat bubble C: thick open arc -->
  <path d="M 152 54
           A 64 64 0 1 0 152 146"
        fill="none"
        stroke="oklch(0.55 0.18 30)"
        stroke-width="34"
        stroke-linecap="round"/>

  <!-- bubble tail (cocoon flick at bottom-right) -->
  <path d="M 144 142
           Q 168 162 178 178
           Q 156 168 138 156 Z"
        fill="oklch(0.55 0.18 30)"/>

  <!-- 3 conversation dots -->
  <circle cx="78"  cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
  <circle cx="100" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
  <circle cx="122" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
</svg>
