<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cléa — Stacked logo (vertical)
  Use for: square avatars, business cards, app splash, social profile pics.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="Cléa">
  <title>Cléa</title>
  <defs>
    <style>
      .wordmark {
        font-family: 'Geist', 'Inter', system-ui, sans-serif;
        font-weight: 700;
        font-size: 132px;
        letter-spacing: -0.04em;
        text-anchor: middle;
        fill: oklch(0.20 0.02 30);
      }
    </style>
  </defs>

  <!-- mark centered -->
  <g transform="translate(80 40)">
    <path d="M 152 54 A 64 64 0 1 0 152 146"
          fill="none" stroke="oklch(0.55 0.18 30)" stroke-width="34" stroke-linecap="round"/>
    <path d="M 144 142 Q 168 162 178 178 Q 156 168 138 156 Z"
          fill="oklch(0.55 0.18 30)"/>
    <circle cx="78"  cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
    <circle cx="100" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
    <circle cx="122" cy="100" r="6" fill="oklch(0.55 0.18 30)"/>
  </g>

  <!-- wordmark -->
  <text x="180" y="400" class="wordmark">Cléa</text>
</svg>
