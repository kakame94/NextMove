<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maison Forge — Favicon
  Monogramme MF stylisé, cuivre sur cream, simplifié pour 16-32px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Maison Forge">
  <title>Maison Forge</title>
  <rect width="200" height="200" rx="32" fill="#F0EBE0"/>
  <!-- trait cuivre -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="#B86A2E" stroke-width="6"/>
  <!-- M F en serif italique -->
  <text x="100" y="148" font-family="Georgia, 'Cormorant Garamond', serif"
        font-style="italic" font-weight="600" font-size="100"
        fill="#243845" text-anchor="middle" letter-spacing="-2">MF</text>
</svg>
